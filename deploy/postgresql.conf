# Postgres 17 — gerado por deploy/onboard para newera-relay.
#
# NÃO edite direto na VPS: o próximo onboard.sh reescreve. Mude o
# template em agendo-certo-internal/deploy/onboard/templates.
#
# O padrão do Postgres é deliberadamente conservador (pensado pra caber
# num servidor de 20 anos atrás): shared_buffers de 128MB e um planner
# que assume disco mecânico. Num SSD isso deixa muita performance na
# mesa e faz o planner escolher plano errado.
#
# Os três valores dimensionados pelo tamanho do container estão
# parametrizados (shared_buffers, effective_cache_size,
# max_connections); o resto vale pra qualquer OLTP e vem do
# agendo-certo, onde já está em produção.
#
# ATENÇÃO ao dividir uma máquina entre vários sistemas: cada instância
# tem o SEU shared_buffers, mas o page cache do kernel é COMPARTILHADO.
# Somar effective_cache_size de todos os bancos acima da RAM real faz
# TODOS os planners superestimarem o cache e escolherem plano ruim ao
# mesmo tempo.

# ---------------------------------------------------------------------
# Conexões
# ---------------------------------------------------------------------
listen_addresses = '*'
# '*' aqui é seguro porque o container não publica porta e a rede `backend`
# do compose é `internal: true`. O isolamento é da rede, não do bind.
port = 5432

max_connections = 20
# A app abre no máximo 60 (3 pools × 20, ver infrastructure/postgres).
# Os 40 restantes são folga pro backup, pra psql de emergência e pras
# conexões reservadas ao superusuário.
superuser_reserved_connections = 3

# ---------------------------------------------------------------------
# Memória
# ---------------------------------------------------------------------
shared_buffers = 128MB
# 25% do limite do container. Subir muito além disso tem retorno
# decrescente: o page cache do kernel já cacheia os mesmos blocos, e
# shared_buffers grande demais aumenta o custo de checkpoint.

effective_cache_size = 384MB
# NÃO aloca nada — é só uma dica pro planner sobre quanto do banco ele
# pode assumir que está em cache (shared_buffers + page cache do SO).
# Subestimar aqui faz o planner evitar index scan e preferir seq scan.

work_mem = 8MB
# Por operação de sort/hash, não por conexão: uma query com 3 sorts usa
# 3×. Com 100 conexões o pior caso teórico é enorme, mas a concorrência
# real é ~20. 8MB cobre os ORDER BY/JOIN dessa aplicação sem derramar
# pra disco, e mantém o pior caso sob controle.

maintenance_work_mem = 256MB
# Usado por VACUUM, CREATE INDEX e ALTER TABLE. Generoso de propósito:
# essas operações são pontuais e rápidas com mais memória.

# ---------------------------------------------------------------------
# Planner — este servidor tem SSD
# ---------------------------------------------------------------------
random_page_cost = 1.1
# O padrão é 4.0, que codifica "buscar página aleatória custa 4× uma
# sequencial" — verdade em disco mecânico, falso em SSD. Com 4.0 o planner
# evita index scan em tabela grande e faz seq scan à toa. Esta é
# provavelmente a linha de maior impacto do arquivo inteiro.

effective_io_concurrency = 200
# Quantas requisições de I/O simultâneas o disco aguenta. SSD NVMe
# aguenta centenas; o padrão 1 assume um único braço mecânico.

# ---------------------------------------------------------------------
# Paralelismo — são 2 vCPU, e um deles a app também usa
# ---------------------------------------------------------------------
max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
# Paralelismo agressivo em 2 núcleos é contraproducente: os workers
# competem com a própria app pelo mesmo CPU, e o custo de coordenação
# come o ganho. Em OLTP de transação curta, quase nada se beneficia.

jit = off
# JIT compila expressões pra código nativo — vale em query analítica que
# roda por segundos. Em transação de milissegundos, o tempo de compilar
# é MAIOR que o de executar, então JIT deixa mais lento. Desligar é a
# recomendação padrão pra OLTP, e ainda economiza CPU num servidor de 2
# núcleos.

# ---------------------------------------------------------------------
# WAL e checkpoint — durabilidade
# ---------------------------------------------------------------------
wal_level = replica
# Suficiente pra backup físico e pra adicionar uma réplica no futuro sem
# precisar reiniciar.

synchronous_commit = on
# Mantido LIGADO de propósito. Desligar dá um ganho real de throughput,
# mas significa que um commit confirmado ao cliente pode se perder num
# crash. Num sistema que confirma agendamento e pagamento pra cliente
# final, isso não é uma troca aceitável.

wal_compression = lz4
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
# Espalha a escrita do checkpoint por 90% do intervalo em vez de despejar
# tudo de uma vez — evita o pico de I/O que trava as queries a cada
# checkpoint.

# ---------------------------------------------------------------------
# Autovacuum — mais agressivo que o padrão
# ---------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
# Os padrões (0.2/0.1) só disparam vacuum depois de 20% da tabela virar
# lixo. Nas tabelas quentes desta app — jobs (fila com SKIP LOCKED),
# refresh_tokens (rotacionados a cada uso) e conversation_messages — isso
# significa bloat e index scan degradado entre um vacuum e outro. 5% é
# mais caro em I/O e muito mais saudável pra tabela com alta rotatividade.

# ---------------------------------------------------------------------
# Observabilidade — sem isso, "o sistema está lento" não tem resposta
# ---------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

log_min_duration_statement = 500ms
# Loga só query que passa de meio segundo. Logar tudo em produção enche
# disco e esconde o que importa.

log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
# log_lock_waits é o que revela contenção: sem ele, "travou" não tem
# diagnóstico. Esta app tem EXCLUDE constraint de agendamento e fila com
# SELECT FOR UPDATE — os dois lugares onde lock waits aparecem.

log_autovacuum_min_duration = 1s
log_temp_files = 10MB
# Arquivo temporário grande = work_mem insuficiente pra alguma query.
# É o sinal que diz quando aumentar work_mem, em vez de chutar.

log_line_prefix = '%m [%p] %q%u@%d '

# UTC no servidor, SEMPRE. Nada de horário local aqui.
#
# Este produto atende estabelecimentos que podem estar em fusos diferentes,
# e o horário de verão brasileiro pode voltar a qualquer momento por
# decreto. Um banco em America/Sao_Paulo faria `now()`, `CURRENT_DATE` e
# todo `timestamptz` mudarem de significado conforme a política de fuso do
# servidor — e uma hora repetida (ou inexistente) na virada do DST vira
# agendamento duplicado ou perdido, sem erro nenhum.
#
# Converter pro fuso do estabelecimento é responsabilidade da aplicação, que
# já embute o banco IANA inteiro pra isso (`import _ "time/tzdata"`,
# app/tzdata.go). O banco guarda instante; o app decide como mostrar.
log_timezone = 'UTC'
timezone = 'UTC'

# ---------------------------------------------------------------------
# Segurança
# ---------------------------------------------------------------------
password_encryption = scram-sha-256
# Garante que qualquer senha criada DEPOIS do initdb também use scram —
# inclusive app_role e admin_role, que a aplicação cria no boot
# (postgres.BootstrapRoles). Sem isso elas poderiam nascer com md5.

row_security = on
# RLS respeitada por padrão. A app depende disso pro isolamento entre
# estabelecimentos (§9); deixar explícito evita que uma mudança de
# default silenciosamente desligue o isolamento multi-tenant.

# ---------------------------------------------------------------------
# Timeouts — nenhuma query deve poder rodar pra sempre
# ---------------------------------------------------------------------
statement_timeout = 30s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s
# idle_in_transaction é o mais importante dos três: uma transação aberta e
# esquecida segura locks E impede o autovacuum de limpar tuplas mortas do
# banco INTEIRO. Um bug de "esqueci o commit" vira degradação global sem
# esse timeout.

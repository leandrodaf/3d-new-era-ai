name: Linux system dependencies
description: Headers needed to build the eframe/winit/wgpu stack on Ubuntu runners.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # A runner reads no man pages: rebuilding their index after the
        # install was a good part of this step's time.
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -qq -o Acquire::Languages=none
        sudo apt-get install -y --no-install-recommends \
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
          libxrandr-dev libxi-dev libvulkan-dev

name: CI

# Prose-only changes skip the whole run: nothing in the list below reaches a
# compiler or a linter. The plugin's own markdown is deliberately absent — the
# Format job runs `plugin validate`, which reads every SKILL.md. GitHub Actions
# does not expand YAML anchors, so the list is spelled out twice.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE-*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".coderabbit.yaml"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE-*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".coderabbit.yaml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # The plugin manifests and server.json repeat Cargo.toml's version.
      - run: scripts/sync-version.sh --check
      # The plugin and its marketplace load in Claude Code.
      - run: npx --yes @anthropic-ai/claude-code plugin validate . && npx --yes @anthropic-ai/claude-code plugin validate plugin && npx --yes @anthropic-ai/claude-code plugin validate plugin-desktop

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - name: Build binary
        run: cargo build -p newera --locked
      # The binary just built, talked to over MCP like an AI client would. It
      # was a job of its own that compiled this same binary again.
      - name: MCP smoke test
        if: runner.os == 'Linux'
        run: scripts/mcp-smoke.sh target/debug/newera

  cloud:
    name: Hosted service (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newera
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/newera
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p newera-cloud --locked

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `+1.95` overrides rust-toolchain.toml, which pins `stable`.
      - run: cargo +1.95 check --workspace --locked

  web:
    name: Web viewer and editor (wasm32)
    runs-on: ubuntu-latest
    # What is checked here is that the wasm runs, not how small it is: thin LTO
    # with one codegen unit was most of this job's compile time. publish.yml
    # builds with the full release profile and runs these same browser tests
    # before anything reaches the site.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p newera-web --release --target wasm32-unknown-unknown --locked
      - run: cargo clippy -p newera-app -p newera-editor-web --target wasm32-unknown-unknown --locked -- -D warnings
      # Building it proves nothing about it running: this draws a wall with the
      # mouse in a headless Chrome and fails on any error the page logs.
      # A prebuilt wasm-bindgen: compiling it here would cost more than the
      # test it serves.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Build the browser editor
        run: |
          cargo build -p newera-editor-web --release --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --no-typescript --out-dir web/editor/pkg \
            target/wasm32-unknown-unknown/release/newera_editor_web.wasm
          cp target/wasm32-unknown-unknown/release/newera_web.wasm web/
      - name: Draw a wall in the browser
        run: |
          python3 -m http.server 8790 --bind 127.0.0.1 --directory web &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8790/editor/ >/dev/null && break; sleep 0.25; done
          mkdir -p target/web-e2e
          node scripts/web-editor-e2e.mjs http://127.0.0.1:8790/editor/ target/web-e2e
      # And again without WebGPU: the path a Firefox visitor lands on.
      - name: Draw a wall without WebGPU
        run: NO_WEBGPU=1 node scripts/web-editor-e2e.mjs http://127.0.0.1:8790/editor/ target/web-e2e
      # The browser as an MCP server: the tab switches it on, an AI client
      # talks to the address the relay hands out, and what it draws has to be
      # in that tab's project.
      # What a phone gets: the page must not scroll sideways, nothing may be
      # too small to tap, and no text below what a person can read at arm's
      # length — checked at four real handset sizes.
      - name: The site and the editor on a phone
        run: |
          RUN_CHROME_TESTS=1 node --test scripts/chrome-session.test.mjs
          python3 -m http.server 8801 --bind 127.0.0.1 --directory site &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8801/ >/dev/null && break; sleep 0.25; done
          node scripts/mobile-audit.mjs http://127.0.0.1:8801/ target/mobile
          node scripts/mobile-audit.mjs http://127.0.0.1:8790/editor/ target/mobile-app
          node scripts/mobile-audit.mjs http://127.0.0.1:8790/ target/mobile-viewer
      - name: An AI draws in the browser over MCP
        run: |
          cargo build -p newera-relay --release --locked
          PORT=7979 ./target/release/newera-relay &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:7979/health >/dev/null && break; sleep 0.25; done
          node scripts/web-mcp-e2e.mjs http://127.0.0.1:8790/editor/ http://127.0.0.1:7979
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-editor-screenshots
          path: target/web-e2e
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots
          path: |
            target/mobile
            target/mobile-app
            target/mobile-viewer
          if-no-files-found: ignore

  deny:
    name: Licenses & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: newera-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: newera-macos-apple-silicon.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: newera-macos-intel.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: newera-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Filled on main by release-cache.yml: a tag can read main's caches but
      # never an earlier tag's, so saving one here would only be thrown away.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false
      # The Sentry DSN is baked into released binaries only; it lives in the
      # repository's secrets, never in its files, and CI builds go without it.
      - run: cargo build -p newera --release --locked --target ${{ matrix.target }}
        env:
          NEWERA_SENTRY_DSN: ${{ secrets.NEWERA_SENTRY_DSN }}
          NEWERA_GA_API_SECRET: ${{ secrets.NEWERA_GA_API_SECRET }}

      # Asset names carry no version, so releases/latest/download/<asset>
      # always points at the newest build.
      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          case "${{ runner.os }}" in
            Windows)
              mkdir "$stage/3D New Era AI"
              cp "$bin/newera.exe" "$bin/newera-gui.exe" README.md LICENSE-MIT LICENSE-APACHE "$stage/3D New Era AI/"
              (cd "$stage" && 7z a "$GITHUB_WORKSPACE/${{ matrix.asset }}" "3D New Era AI" >/dev/null)
              ;;
            macOS)
              scripts/macos-app.sh "$bin/newera" "$stage" "$GITHUB_SHA"
              # ditto keeps the signature and permissions inside the zip.
              ditto -c -k --keepParent "$stage/3D New Era AI.app" "${{ matrix.asset }}"
              ;;
            Linux)
              mkdir "$stage/newera"
              cp "$bin/newera" README.md LICENSE-MIT LICENSE-APACHE "$stage/newera/"
              # Desktop integration: menu entry, hicolor icons, the .newera
              # type and its document icon, installed by ./install-desktop.sh.
              cp scripts/install-desktop.sh "$stage/newera/"
              mkdir -p "$stage/newera/share/applications" "$stage/newera/share/mime/packages" \
                       "$stage/newera/share/metainfo" "$stage/newera/share/icons"
              cp assets/linux/newera.desktop "$stage/newera/share/applications/"
              cp assets/linux/newera.xml "$stage/newera/share/mime/packages/"
              cp assets/linux/io.github.leandrodaf.newera.metainfo.xml "$stage/newera/share/metainfo/"
              cp -r assets/linux/hicolor "$stage/newera/share/icons/"
              tar czf "${{ matrix.asset }}" -C "$stage" newera
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # One MCP Bundle for every platform, from the binaries just built: what Claude
  # Desktop installs with a double click, and the package the MCP Registry
  # lists. On macOS because that is where lipo makes the Apple binary
  # universal and codesign signs it again.
  mcpb:
    name: Pack newera-mcp.mcpb
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mcpb"
          mkdir -p "$work/linux" "$work/arm" "$work/intel" "$work/windows"
          tar xzf dist/newera-linux-x64.tar.gz -C "$work/linux"
          ditto -x -k dist/newera-macos-apple-silicon.zip "$work/arm"
          ditto -x -k dist/newera-macos-intel.zip "$work/intel"
          unzip -q dist/newera-windows-x64.zip -d "$work/windows"
          lipo -create -output "$work/newera-macos" \
            "$work/arm/3D New Era AI.app/Contents/MacOS/newera" \
            "$work/intel/3D New Era AI.app/Contents/MacOS/newera"
          codesign --force --sign - "$work/newera-macos"
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" ;;
          esac
          scripts/mcpb.sh --version "$version" --out newera-mcp.mcpb \
            --linux "$work/linux/newera/newera" \
            --darwin "$work/newera-macos" \
            --windows "$work/windows/3D New Era AI/newera.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: newera-mcp.mcpb
          path: newera-mcp.mcpb

  publish:
    name: Publish GitHub release
    needs: [build, mcpb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The notes are the tag's section of CHANGELOG.md: GitHub's generated
      # notes list pull requests, and this project commits to main, so they
      # came out empty. No section, no release.
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum newera-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: 3D New Era AI ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/newera-*
            dist/SHA256SUMS.txt
          generate_release_notes: true

  # The MCP Registry, and through it every catalog that reads it (VS Code,
  # GitHub, Glama, PulseMCP, mcp.so, JetBrains, Zed). Skipped until the
  # domain key exists (scripts/registry-key.sh), so a fork never tries.
  registry:
    name: Publish to the MCP Registry
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: env.MCP_REGISTRY_PRIVATE_KEY != ''
      - uses: actions/download-artifact@v8
        if: env.MCP_REGISTRY_PRIVATE_KEY != ''
        with:
          name: newera-mcp.mcpb
          path: dist
      - name: Publish
        if: env.MCP_REGISTRY_PRIVATE_KEY != ''
        run: |
          curl -sL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" mcp-publisher
          MCP_PUBLISHER="$RUNNER_TEMP/mcp-publisher" scripts/registry-publish.sh "${GITHUB_REF_NAME#v}" dist/newera-mcp.mcpb

  # winget: a pull request to microsoft/winget-pkgs with the new version, from
  # a fork the token can push to. Needs the package there once already
  # (scripts/winget.sh writes the first manifests) and WINGET_TOKEN, a classic
  # token with public_repo.
  winget:
    name: Send to winget
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: LeandroFerreira.3DNewEraAI
          installers-regex: 'windows-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  # Homebrew: the cask in leandrodaf/homebrew-tap, rewritten with this
  # release's checksums. Needs HOMEBREW_TAP_TOKEN, allowed to push there.
  homebrew:
    name: Update the Homebrew tap
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.HOMEBREW_TAP_TOKEN != ''
      - uses: actions/checkout@v7
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: leandrodaf/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write the cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt
          arm="$(awk '/newera-macos-apple-silicon.zip/ {print $1}' SHA256SUMS.txt)"
          intel="$(awk '/newera-macos-intel.zip/ {print $1}' SHA256SUMS.txt)"
          scripts/homebrew.sh "${GITHUB_REF_NAME#v}" "$arm" "$intel" tap/Casks/3d-new-era-ai.rb
          cd tap
          git config user.name "3D New Era AI release"
          git config user.email "release@3dneweraai.com"
          git add Casks/3d-new-era-ai.rb
          git commit -m "3d-new-era-ai ${GITHUB_REF_NAME#v}" || exit 0
          git push

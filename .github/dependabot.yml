version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      egui:
        patterns: ["egui*", "eframe", "wgpu*"]
      rust-deps:
        patterns: ["*"]
        exclude-patterns: ["egui*", "eframe", "wgpu*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tags are Rust versions: `@1.95` is the MSRV job, not an outdated action.
      - dependency-name: dtolnay/rust-toolchain

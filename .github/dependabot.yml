version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # egui's font crate and icon set must move with egui itself, or two
      # epaint versions end up in the graph.
      egui:
        patterns: ["egui*", "eframe", "epaint*", "wgpu*"]
      rust-deps:
        patterns: ["*"]
        exclude-patterns: ["egui*", "eframe", "epaint*", "wgpu*"]
    ignore:
      # zip 9.1 needs getrandom on wasm32, whose browser imports the viewer
      # (loaded without wasm-bindgen) cannot provide: it never starts.
      - dependency-name: zip
        versions: [">= 9.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tags are Rust versions: `@1.95` is the MSRV job, not an outdated action.
      - dependency-name: dtolnay/rust-toolchain

[package]
name = "newera-telemetry"
description = "3D New Era AI: crash reports and usage notes sent to Sentry, on by default and off with one switch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The same client Sentry uses here, for the one analytics ping.
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
sentry = { version = "0.49.2", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "release-health",
    "tracing",
    "ureq",
    "rustls",
] }

[lints]
workspace = true

[package]
name = "newera-editor-web"
description = "The 3D New Era AI editor running in the browser (WebGPU or WebGL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
log = "0.4"
newera-app.workspace = true
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3", features = ["console", "Document", "HtmlCanvasElement", "Window"] }

# `#[wasm_bindgen]` expands to unsafe glue, so this crate cannot forbid it
# like the rest of the workspace; everything else matches it.
[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

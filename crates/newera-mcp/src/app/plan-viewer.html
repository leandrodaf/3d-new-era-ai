<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D New Era AI</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --panel: var(--color-background-secondary, #f4f4f2);
    --text: var(--color-text-primary, #1d1d1b);
    --muted: var(--color-text-secondary, #6b6b66);
    --line: var(--color-border-primary, #dcdcd6);
    --accent: #2f6fdb;
    --radius: var(--border-radius-md, 8px);
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1c1a);
    --panel: var(--color-background-secondary, #262624);
    --text: var(--color-text-primary, #ececea);
    --muted: var(--color-text-secondary, #a3a39d);
    --line: var(--color-border-primary, #3a3a37);
    --accent: #7aa7ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px; border-bottom: 1px solid var(--line); }
  .bar .title { font-weight: 600; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; min-height: 32px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .stage { position: relative; height: 420px; overflow: hidden; touch-action: none; background: #fff; cursor: grab; }
  .stage.dragging { cursor: grabbing; }
  .stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; max-width: none; }
  .stage .note { position: absolute; inset: 0; display: grid; place-items: center; color: #6b6b66; padding: 16px; text-align: center; }
  .zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
  .zoom button { width: 32px; padding: 0; }
  .foot { display: flex; gap: 12px; flex-wrap: wrap; padding: 6px 8px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  @media (max-width: 420px) { .stage { height: 320px; } }
</style>
</head>
<body>
  <div class="bar">
    <span class="title" id="title">3D New Era AI</span>
    <button id="plan" aria-pressed="true"></button>
    <button id="three" aria-pressed="false"></button>
    <button id="refresh"></button>
    <button id="open"></button>
  </div>
  <div class="stage" id="stage">
    <img id="picture" alt="">
    <div class="note" id="note"></div>
    <div class="zoom">
      <button id="in" aria-label="+">+</button>
      <button id="out" aria-label="−">−</button>
      <button id="fit" aria-label="fit">⤢</button>
    </div>
  </div>
  <div class="foot" id="foot"></div>
<script>
(() => {
  "use strict";
  const WORDS = {
    en: { plan: "Plan", three: "3D", refresh: "Refresh", open: "Open editor", waiting: "Waiting for the plan…", busy: "Rendering…", failed: "Could not render: ", rooms: "rooms", walls: "walls", pieces: "pieces", area: "m²" },
    pt: { plan: "Planta", three: "3D", refresh: "Atualizar", open: "Abrir editor", waiting: "Aguardando a planta…", busy: "Renderizando…", failed: "Não foi possível renderizar: ", rooms: "cômodos", walls: "paredes", pieces: "peças", area: "m²" },
    es: { plan: "Plano", three: "3D", refresh: "Actualizar", open: "Abrir editor", waiting: "Esperando el plano…", busy: "Renderizando…", failed: "No se pudo renderizar: ", rooms: "ambientes", walls: "paredes", pieces: "piezas", area: "m²" },
    fr: { plan: "Plan", three: "3D", refresh: "Actualiser", open: "Ouvrir l’éditeur", waiting: "En attente du plan…", busy: "Rendu…", failed: "Rendu impossible : ", rooms: "pièces", walls: "murs", pieces: "objets", area: "m²" },
  };
  let words = WORDS.en;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), picture = $("picture"), note = $("note");
  let editorUrl = "https://3dneweraai.com/app/";

  // --- JSON-RPC over postMessage with the host --------------------------
  let nextId = 1;
  const pending = new Map();
  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params: params || {} }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id) && !m.method) {
      const { resolve, reject } = pending.get(m.id);
      pending.delete(m.id);
      m.error ? reject(new Error(m.error.message || "error")) : resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") show(m.params);
    else if (m.method === "ui/notifications/host-context-changed") context(m.params);
    else if (m.id !== undefined && m.method) send({ jsonrpc: "2.0", id: m.id, result: {} });
  });

  function context(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
    if (ctx.locale) {
      const lang = String(ctx.locale).slice(0, 2).toLowerCase();
      words = WORDS[lang] || WORDS.en;
      label();
    }
  }
  function label() {
    $("plan").textContent = words.plan;
    $("three").textContent = words.three;
    $("refresh").textContent = words.refresh;
    $("open").textContent = words.open;
    if (!picture.src) note.textContent = words.waiting;
  }

  // --- What is on screen --------------------------------------------------
  let mode = "plan", lastPlan = null;
  function show(result) {
    const data = result && result.structuredContent;
    if (!data || !data.svg) return;
    lastPlan = data;
    if (data.editor) editorUrl = data.editor;
    $("title").textContent = data.name || "3D New Era AI";
    const s = data.summary || {};
    const parts = [];
    if (s.rooms !== undefined) parts.push(`${s.rooms} ${words.rooms}`);
    if (s.area !== undefined) parts.push(`${s.area} ${words.area}`);
    if (s.walls !== undefined) parts.push(`${s.walls} ${words.walls}`);
    if (s.pieces !== undefined) parts.push(`${s.pieces} ${words.pieces}`);
    $("foot").textContent = parts.join(" · ");
    if (mode === "plan") setPicture("data:image/svg+xml;charset=utf-8," + encodeURIComponent(sized(data.svg)));
  }
  // The plan comes sized in real centimeters — metres of SVG, far past what a
  // browser will paint into an image. Give it a pixel size from its viewBox,
  // large enough to stay sharp when zoomed in.
  function sized(svg) {
    const box = /viewBox="\s*([-\d.e]+)[\s,]+([-\d.e]+)[\s,]+([\d.e]+)[\s,]+([\d.e]+)\s*"/.exec(svg);
    if (!box) return svg;
    const w = parseFloat(box[3]), h = parseFloat(box[4]);
    const k = 2400 / Math.max(w, h);
    return svg.replace(/<svg\b[^>]*>/, (tag) =>
      tag.replace(/\swidth="[^"]*"/, "").replace(/\sheight="[^"]*"/, "")
         .replace(/^<svg/, `<svg width="${Math.round(w * k)}" height="${Math.round(h * k)}"`));
  }
  function setPicture(src) {
    note.textContent = "";
    picture.onload = fit;
    picture.src = src;
  }
  function setMode(next) {
    mode = next;
    $("plan").setAttribute("aria-pressed", String(next === "plan"));
    $("three").setAttribute("aria-pressed", String(next === "3d"));
  }

  async function callTool(name, args) {
    const result = await request("tools/call", { name, arguments: args || {} });
    if (result && result.isError) {
      const text = (result.content || []).map((c) => c.text || "").join(" ");
      throw new Error(text || name);
    }
    return result;
  }
  async function busy(button, work) {
    button.disabled = true;
    try { await work(); } catch (e) { note.textContent = words.failed + e.message; }
    finally { button.disabled = false; }
  }

  $("plan").onclick = () => { setMode("plan"); if (lastPlan) show({ structuredContent: lastPlan }); };
  $("three").onclick = () => busy($("three"), async () => {
    setMode("3d");
    note.textContent = words.busy;
    const w = Math.min(1200, Math.max(320, Math.round(stage.clientWidth * (window.devicePixelRatio || 1))));
    const h = Math.round(w * 0.66);
    const result = await callTool("render_3d", { w, h });
    const image = (result.content || []).find((c) => c.type === "image");
    if (image) setPicture(`data:${image.mimeType || "image/png"};base64,${image.data}`);
  });
  $("refresh").onclick = () => busy($("refresh"), async () => {
    const result = await callTool("show_plan", {});
    setMode("plan");
    show(result);
  });
  $("open").onclick = () => request("ui/open-link", { url: editorUrl }).catch(() => {});

  // --- Pan and zoom -------------------------------------------------------
  let scale = 1, x = 0, y = 0;
  function apply() { picture.style.transform = `translate(${x}px, ${y}px) scale(${scale})`; }
  function fit() {
    const w = picture.naturalWidth || picture.width, h = picture.naturalHeight || picture.height;
    if (!w || !h) return;
    scale = Math.min(stage.clientWidth / w, stage.clientHeight / h) * 0.95;
    x = (stage.clientWidth - w * scale) / 2;
    y = (stage.clientHeight - h * scale) / 2;
    apply();
  }
  function zoomAt(factor, cx, cy) {
    const next = Math.min(40, Math.max(0.05, scale * factor));
    x = cx - (cx - x) * (next / scale);
    y = cy - (cy - y) * (next / scale);
    scale = next;
    apply();
  }
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  const pointers = new Map();
  let pinch = 0;
  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.classList.add("dragging");
  });
  stage.addEventListener("pointermove", (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const now = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, now);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) {
        const r = stage.getBoundingClientRect();
        zoomAt(d / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
      pinch = d;
    } else {
      x += now.x - prev.x; y += now.y - prev.y; apply();
    }
  });
  const up = (e) => { pointers.delete(e.pointerId); pinch = 0; if (!pointers.size) stage.classList.remove("dragging"); };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  $("in").onclick = () => zoomAt(1.3, stage.clientWidth / 2, stage.clientHeight / 2);
  $("out").onclick = () => zoomAt(1 / 1.3, stage.clientWidth / 2, stage.clientHeight / 2);
  $("fit").onclick = fit;

  // --- Size and handshake -------------------------------------------------
  new ResizeObserver(() => {
    notify("ui/notifications/size-changed", { width: document.body.scrollWidth, height: document.body.scrollHeight });
  }).observe(document.body);

  label();
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "3D New Era AI plan", version: "1" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then((result) => {
    context(result && result.hostContext);
    notify("ui/notifications/initialized");
  }).catch(() => notify("ui/notifications/initialized"));
})();
</script>
</body>
</html>

[package]
name = "newera-app"
description = "Desktop editor for 3D New Era AI: catalog, 2D floor plan and native 3D view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bytemuck.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui-phosphor = "0.14"
glam.workspace = true
image.workspace = true
newera-catalog.workspace = true
newera-core.workspace = true
newera-ergonomics.workspace = true
newera-joinery.workspace = true
newera-sh3d.workspace = true
newera-draw.workspace = true
newera-render.workspace = true
serde_json.workspace = true
rfd = "0.17"
serde.workspace = true
tracing.workspace = true
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
newera-plugins.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3", features = ["Blob", "console", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }

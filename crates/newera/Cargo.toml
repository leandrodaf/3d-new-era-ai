[package]
name = "newera"
description = "3D New Era AI: open-source home design editor with built-in MCP for AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
build = "build.rs"
# Two binaries live here (`newera` and the windowed `newera-gui`), so plain
# `cargo run -p newera` needs to be told which one is the default.
default-run = "newera"

[lib]
name = "newera_cli"
path = "src/lib.rs"

[[bin]]
name = "newera"
path = "src/main.rs"

[[bin]]
name = "newera-gui"
path = "src/gui.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
newera-app.workspace = true
newera-catalog.workspace = true
newera-core.workspace = true
newera-sh3d.workspace = true
newera-mcp.workspace = true
newera-server.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.26"

[lints]
workspace = true

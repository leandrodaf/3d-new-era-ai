# Spelling for the prose. https://github.com/crate-ci/typos
#
# The Rust tree is out of scope on purpose: the UI strings are translated
# inline, so a spell checker carrying an English dictionary reads "Duplicar
# versão atual" as three mistakes. The Docs workflow passes it the documentation
# instead.
[files]
extend-exclude = [
  # English dictionary, Portuguese page.
  "README.pt-BR.md",
]
